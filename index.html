<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieVue2!</title>
    <!-- My javascript -->
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="style.css" />

    <!-- My FA kit. -->
    <script
      src="https://kit.fontawesome.com/87daa82b97.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header class="overlay">
      <nav>
        <div class="header__logo">
          <div class="header__logo--brand">
            <img
              src="./assets/movieVue.png"
              class="header__logo--img"
              alt="MovieVue Camera"
            />
            <h1 class="header__logo--title">movieVue</h1>
          </div>
        </div>
        <ul class="header__links">
          <li><a href="">Search Movies</a></li>
          <li class="contact"><a href="">Contact</a></li>
        </ul>
      </nav>
    </header>

    <div class="container">
      <div class="row">
        <section id="search">
          <label class="movie__search--label">Find Your Movie</label>

          <div class="input-wrap">
            <input
              type="text"
              id="search-input"
              name=""
              placeholder="Search By Movie Title"
            />
            <i
              class="fa-solid fa-magnifying-glass mag"
              style="color: #b197fc"
              onclick="searchMovies()"
            ></i>
          </div>
        </section>
      </div>
    </div>

    <div class="container results">
      <div class="selections">
        <h2>Search Results:</h2>
      </div>
      <div class="loading">
        <div class="movie">
          <div class="movie-card">
            <div class="movie-card__container">
              <div class="movies product__content">
                <img
                  src="assets/stripoll.png"
                  alt="Loading Titles"
                  class="product__card--img"
                />
                <p class="product__title"></p>
                <p class="product__desc"></p>
                <p class="product__detail"></p>
              </div>
              <div class="movie__search--container"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="movie-list"></div>
    </div>
  </body>
</html>
